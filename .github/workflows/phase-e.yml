name: Phase E factory UBI build and audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-e-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/kkstone/immortalwrt-ipq50xx
  REPO_BRANCH: openwrt-21.02
  REPO_COMMIT: e1ea5628d486979252a5dd7e507f335381b3ed59
  GOLANG_COMMIT: 17077f28edf4f18be1cb490253e76e7f14876459
  NODE_COMMIT: 01cf77b516b7cd4cef84a667415544350e4c2501
  FRP_PACKAGES_REPO: https://github.com/immortalwrt/packages.git
  FRP_PACKAGES_COMMIT: 5c4151039612910a89f082967842c387d1d972e3
  PASSWALL_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall.git
  PASSWALL_COMMIT: 92714cdb2eb613fbab195f8b6005b9b1d9843294
  PASSWALL_PACKAGES_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git
  PASSWALL_PACKAGES_COMMIT: e73ad1c77a96fdaa498807ff7bc717dc92c349ea
  PHASE_B_CONFIG_SHA256: 51e5778feb79587e67b77381eef88cef61ebe77c3c5db032c2d8fa7bbd102337
  EXPECTED_KERNEL_ABI: 5.4-qsdk-11.5.0.5-1-c257fb1f68e3634fc68fbf99b141f87d
  TZ: Asia/Shanghai

jobs:
  phase-e:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout Phase E build definition
        uses: actions/checkout@v4

      - name: Prepare Linux build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
            ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          python3 -m pip install --user ubi-reader
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone frozen ImmortalWrt source
        working-directory: /workdir
        run: |
          git clone --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          git -C openwrt checkout --detach "$REPO_COMMIT"
          test "$(git -C openwrt rev-parse HEAD)" = "$REPO_COMMIT"
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Prepare frozen feeds
        run: |
          cp feeds.conf.default openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          rm -rf feeds/packages/lang/golang feeds/packages/lang/node
          git clone --branch 1.25 https://github.com/kenzok8/golang feeds/packages/lang/golang
          git -C feeds/packages/lang/golang checkout --detach "$GOLANG_COMMIT"
          test "$(git -C feeds/packages/lang/golang rev-parse HEAD)" = "$GOLANG_COMMIT"
          git clone --branch packages-24.10 https://github.com/sbwml/feeds_packages_lang_node-prebuilt feeds/packages/lang/node
          git -C feeds/packages/lang/node checkout --detach "$NODE_COMMIT"
          test "$(git -C feeds/packages/lang/node rev-parse HEAD)" = "$NODE_COMMIT"
          rm -rf feeds/packages/net/frp "$RUNNER_TEMP/frp-overlay"
          git clone --filter=blob:none --no-checkout "$FRP_PACKAGES_REPO" "$RUNNER_TEMP/frp-overlay"
          git -C "$RUNNER_TEMP/frp-overlay" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/frp-overlay" sparse-checkout set net/frp
          git -C "$RUNNER_TEMP/frp-overlay" checkout --detach "$FRP_PACKAGES_COMMIT"
          test "$(git -C "$RUNNER_TEMP/frp-overlay" rev-parse HEAD)" = "$FRP_PACKAGES_COMMIT"
          cp -a "$RUNNER_TEMP/frp-overlay/net/frp" feeds/packages/net/frp
          grep -Eq '^PKG_VERSION:?=0\.70\.1$' feeds/packages/net/frp/Makefile
          ./scripts/feeds install -a

      - name: Integrate frozen PassWall inputs
        run: |
          cd openwrt
          rm -rf package/feeds/luci/luci-app-passwall
          git clone --filter=blob:none --no-checkout "$PASSWALL_REPO" package/passwall
          git -C package/passwall checkout --detach "$PASSWALL_COMMIT"
          test "$(git -C package/passwall rev-parse HEAD)" = "$PASSWALL_COMMIT"
          git clone --filter=blob:none --no-checkout "$PASSWALL_PACKAGES_REPO" package/passwall-packages
          git -C package/passwall-packages sparse-checkout init --cone
          git -C package/passwall-packages sparse-checkout set chinadns-ng dns2socks ipt2socks microsocks tcping
          git -C package/passwall-packages checkout --detach "$PASSWALL_PACKAGES_COMMIT"
          test "$(git -C package/passwall-packages rev-parse HEAD)" = "$PASSWALL_PACKAGES_COMMIT"
          git -C package/passwall apply --check "$GITHUB_WORKSPACE/patches/passwall/0001-compat-iptables-legacy-packaging.patch"
          git -C package/passwall apply "$GITHUB_WORKSPACE/patches/passwall/0001-compat-iptables-legacy-packaging.patch"

      - name: Generate and gate final configuration
        run: |
          mkdir -p phase-e-results
          cp .config openwrt/.config
          cd openwrt
          set -o pipefail
          "$GITHUB_WORKSPACE/diy-part2.sh" 2>&1 | tee "$GITHUB_WORKSPACE/phase-e-results/make-defconfig.log"
          cp .config "$GITHUB_WORKSPACE/phase-e-results/config.final"
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/phase-e-results/config.diff"
          config_sha="$(sha256sum .config | awk '{print $1}')"
          printf '%s  config.final\n' "$config_sha" > "$GITHUB_WORKSPACE/phase-e-results/config.final.sha256"
          test "$config_sha" = "$PHASE_B_CONFIG_SHA256"
          python3 "$GITHUB_WORKSPACE/scripts/phase-b-config-audit.py" \
            --config .config \
            --diffconfig "$GITHUB_WORKSPACE/phase-e-results/config.diff" \
            --baseline "$GITHUB_WORKSPACE/baselines/run-34227755212.config.buildinfo" \
            --report "$GITHUB_WORKSPACE/phase-e-results/CONFIG-AUDIT.md"

      - name: Record frozen inputs
        run: |
          {
            printf 'build_commit=%s\n' "$GITHUB_SHA"
            printf 'source=%s\n' "$REPO_COMMIT"
            printf 'packages=%s\n' 'e09f3c7d1903cfe7f523e209ab3ec778013ba309'
            printf 'luci=%s\n' '5829eabba50ec0afa17d2ee486bc90dc15180c34'
            printf 'routing=%s\n' 'a9e43101bb726070cbf81b6225fc0625f4a4a5e5'
            printf 'telephony=%s\n' '920fbc5c0a2e4badf51bceff42e9a1e3eb693462'
            printf 'golang=%s\n' "$GOLANG_COMMIT"
            printf 'node=%s\n' "$NODE_COMMIT"
            printf 'frp-package=%s\n' "$FRP_PACKAGES_COMMIT"
            printf 'passwall=%s\n' "$PASSWALL_COMMIT"
            printf 'passwall-packages=%s\n' "$PASSWALL_PACKAGES_COMMIT"
            printf 'phase_b_config_sha256=%s\n' "$PHASE_B_CONFIG_SHA256"
          } > phase-e-results/frozen-inputs.txt
          {
            uname -a
            lsb_release -a
            nproc
            df -h
          } > phase-e-results/environment.txt

      - name: Seed QSDK kernel source downloads
        run: |
          mkdir -p openwrt/dl
          wget -O openwrt/dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz \
            'https://www.dropbox.com/scl/fi/9ts30p2csnlb9imaf8k68/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz?rlkey=sntbyfjgg86gu2uoocgb9ggp1&st=7w81hl56&dl=1'
          wget -O openwrt/dl/linux-5.4-qsdk-11.5.0.5.tar.xz \
            'https://www.dropbox.com/scl/fi/gu7ge6jmefn72ttuop1zs/linux-5.4-qsdk-11.5.0.5.tar.xz?rlkey=tdpq0ye35x290frbh7i8uqrm8&st=jjvegqrr&dl=1'

      - name: Download frozen build inputs
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j8 2>&1 | tee "$GITHUB_WORKSPACE/phase-e-results/download.log"
          find dl -size -1024c -print | tee "$GITHUB_WORKSPACE/phase-e-results/short-downloads.txt"
          test ! -s "$GITHUB_WORKSPACE/phase-e-results/short-downloads.txt"

      - name: Build complete factory firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/phase-e-results/build.log" || \
            make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/phase-e-results/build.log"

      - name: Extract and audit final factory UBI
        run: |
          set -euo pipefail
          target_dir=openwrt/bin/targets/ipq50xx/arm
          image="$target_dir/immortalwrt-ipq50xx-arm-cmcc_rax3000q-squashfs-nand-factory.ubi"
          manifest="$target_dir/immortalwrt-ipq50xx-arm-cmcc_rax3000q.manifest"
          test -f "$image"
          test -f "$manifest"
          test "$(find "$target_dir" -maxdepth 1 -type f -name '*factory.ubi' | wc -l)" -eq 1
          cp "$image" phase-e-results/
          cp "$manifest" phase-e-results/package.manifest
          sha256sum "$image" | sed 's#openwrt/bin/targets/ipq50xx/arm/##' > phase-e-results/SHA256SUMS
          awk -F ' - ' '$1 == "kernel" {print $2}' "$manifest" > phase-e-results/kernel-abi.txt
          test "$(cat phase-e-results/kernel-abi.txt)" = "$EXPECTED_KERNEL_ABI"

          export PATH="$HOME/.local/bin:$PATH"
          ubireader_extract_images -o phase-e-results/ubi-extracted "$image"
          root_volume="$(find phase-e-results/ubi-extracted -type f -name '*vol-rootfs.ubifs' -print -quit)"
          test -n "$root_volume"
          set +e
          unsquashfs \
            -d phase-e-results/rootfs \
            "$root_volume" \
            >phase-e-results/unsquashfs.stdout.log \
            2>phase-e-results/unsquashfs.stderr.log
          unsquashfs_rc=$?
          set -e
          printf '%s\n' "$unsquashfs_rc" > phase-e-results/unsquashfs.exit-code.txt
          echo '===== unsquashfs stdout ====='
          cat phase-e-results/unsquashfs.stdout.log || true
          echo '===== unsquashfs stderr ====='
          cat phase-e-results/unsquashfs.stderr.log || true
          echo "unsquashfs exit code: $unsquashfs_rc"
          if [ "$unsquashfs_rc" -ne 0 ]; then
            exit "$unsquashfs_rc"
          fi

          grep -Eina 'warning:|error:|failed|undefined reference|recursive dependency|missing dependency' \
            phase-e-results/*.log > phase-e-results/warnings-errors-summary.txt || true

          python3 scripts/phase-e-image-audit.py \
            --image "$image" \
            --manifest "$manifest" \
            --rootfs phase-e-results/rootfs \
            --config phase-e-results/config.final \
            --build-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --source-commit "$REPO_COMMIT" \
            --report phase-e-results/PHASE-E-AUDIT.md \
            --size-report phase-e-results/image-size-report.txt \
            --file-inventory phase-e-results/rootfs-critical-files.txt
          rm -rf phase-e-results/rootfs phase-e-results/ubi-extracted
          df -h > phase-e-results/disk-usage.txt

      - name: Upload complete Phase E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-e-factory-ubi-audit-${{ github.run_id }}
          path: phase-e-results
          if-no-files-found: error
