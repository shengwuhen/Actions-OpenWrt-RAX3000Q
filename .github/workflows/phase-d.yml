name: Phase D Hysteria 2.12.2 targeted build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase-d-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/kkstone/immortalwrt-ipq50xx
  REPO_BRANCH: openwrt-21.02
  REPO_COMMIT: e1ea5628d486979252a5dd7e507f335381b3ed59
  GOLANG_COMMIT: 17077f28edf4f18be1cb490253e76e7f14876459
  PASSWALL_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall.git
  PASSWALL_COMMIT: 92714cdb2eb613fbab195f8b6005b9b1d9843294
  PASSWALL_PACKAGES_REPO: https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git
  PASSWALL_PACKAGES_COMMIT: f7f253de5d10f4aefa170c4006be926796c88d10
  PHASE_B_RUN_ID: '34984707282'
  HYSTERIA_SOURCE_COMMIT: 619a6f856b69fb7ee6a7a379e810e68b84004605
  HYSTERIA_SOURCE_HASH: 8db04a112e73685a1e5916d5d4d3df3ed897dbabc3e639fda4880b7ca9a7d18e
  TZ: Asia/Shanghai

jobs:
  phase-d:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm make ninja-build p7zip-full patch pkgconf python3 python3-ply python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo unzip wget xmlto xxd zlib1g-dev zstd jq
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir
          mkdir -p phase-d-results
      - name: Fetch Phase B final config artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PHASE_B_RUN_ID}/artifacts"
          artifact_id=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api" | jq -r '.artifacts[] | select(.name == ("phase-b-defconfig-gate-" + env.PHASE_B_RUN_ID)) | .id' | head -n1)
          test -n "$artifact_id" -a "$artifact_id" != null
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o phase-b.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          unzip -q phase-b.zip -d phase-b-artifact
          cp "phase-b-artifact/phase-b-results/config.final" phase-d-results/config.phase-b.final
          sha256sum phase-d-results/config.phase-b.final > phase-d-results/config.phase-b.sha256
      - name: Clone frozen source and feeds
        working-directory: /workdir
        run: |
          mkdir -p /workdir
          git clone --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          git -C openwrt checkout --detach "$REPO_COMMIT"
          test "$(git -C openwrt rev-parse HEAD)" = "$REPO_COMMIT"
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
      - name: Install pinned feeds and PassWall inputs
        run: |
          set -euo pipefail
          cp feeds.conf.default openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          rm -rf feeds/packages/lang/golang feeds/packages/net/hysteria package/feeds/packages/hysteria
          git clone --branch 1.25 https://github.com/kenzok8/golang feeds/packages/lang/golang
          git -C feeds/packages/lang/golang checkout --detach "$GOLANG_COMMIT"
          test "$(git -C feeds/packages/lang/golang rev-parse HEAD)" = "$GOLANG_COMMIT"
          ./scripts/feeds install -a
          git clone --filter=blob:none --no-checkout "$PASSWALL_REPO" package/passwall
          git -C package/passwall checkout --detach "$PASSWALL_COMMIT"
          git clone --filter=blob:none --no-checkout "$PASSWALL_PACKAGES_REPO" package/passwall-packages
          git -C package/passwall-packages sparse-checkout init --cone
          git -C package/passwall-packages sparse-checkout set hysteria
          git -C package/passwall-packages checkout --detach "$PASSWALL_PACKAGES_COMMIT"
          test "$(git -C package/passwall-packages rev-parse HEAD)" = "$PASSWALL_PACKAGES_COMMIT"
          test "$(sed -n 's/^PKG_VERSION:=//p' package/passwall-packages/hysteria/Makefile)" = 2.12.2
          test "$(sed -n 's/^PKG_HASH:=//p' package/passwall-packages/hysteria/Makefile)" = "$HYSTERIA_SOURCE_HASH"
          rm -rf package/feeds/luci/luci-app-passwall
          git -C package/passwall apply --check "$GITHUB_WORKSPACE/patches/passwall/0001-compat-iptables-legacy-packaging.patch"
          git -C package/passwall apply "$GITHUB_WORKSPACE/patches/passwall/0001-compat-iptables-legacy-packaging.patch"
          test -f package/hysteria/Makefile
          grep -q '^  select PACKAGE_hysteria$' package/passwall/luci-app-passwall/Makefile
          grep -q '$(1)/usr/bin/hysteria' package/hysteria/Makefile
      - name: Defconfig with only Hysteria symbols enabled
        run: |
          set -euo pipefail
          cp .config phase-d-results/config.seed
          cp .config openwrt/.config
          cd openwrt
          "$GITHUB_WORKSPACE/diy-part2.sh"
          sed -i -e '/^CONFIG_PACKAGE_hysteria=/d' -e '/^# CONFIG_PACKAGE_hysteria is not set$/d' .config
          sed -i -e '/^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=/d' -e '/^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set$/d' .config
          printf 'CONFIG_PACKAGE_hysteria=y\nCONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y\n' >> .config
          make defconfig
          grep -qx 'CONFIG_PACKAGE_hysteria=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y' .config
          for p in xray-core sing-box naiveproxy shadowsocks-rust-sslocal shadowsocksr-libev-ssr-local; do ! grep -qx "CONFIG_PACKAGE_${p}=y" .config; done
          cp .config "$GITHUB_WORKSPACE/phase-d-results/config.final"
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/phase-d-results/config.diffconfig"
      - name: Build tools, toolchain, Hysteria and PassWall only
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" tools/install 2>&1 | tee "$GITHUB_WORKSPACE/phase-d-results/build-tools.log"
          make -j"$(nproc)" toolchain/install 2>&1 | tee "$GITHUB_WORKSPACE/phase-d-results/build-toolchain.log"
          make -j"$(nproc)" package/hysteria/compile package/luci-app-passwall/compile 2>&1 | tee "$GITHUB_WORKSPACE/phase-d-results/build-targeted.log"
      - name: Audit config, IPK and embedded version
        run: |
          set -euo pipefail
          ipk=$(find openwrt/bin -type f -name 'hysteria_*.ipk' | head -n1)
          test -n "$ipk"
          python3 scripts/phase-d-audit.py --config phase-d-results/config.final --baseline phase-d-results/config.phase-b.final --ipk "$ipk" --out phase-d-results
          cp "$ipk" phase-d-results/
          sha256sum "$ipk" > phase-d-results/hysteria.ipk.sha256
          ar p "$ipk" data.tar.gz | tar -tzf - | grep -E '(^|/)usr/bin/hysteria$'
          ar p "$ipk" data.tar.gz | tar -xOzf - ./usr/bin/hysteria 2>/dev/null | strings | grep -E '(^|[^0-9])v?2\.12\.2([^0-9]|$)' | head -n5 | tee phase-d-results/hysteria-version-strings.txt
          grep -R -n -E 'hysteria_file|/usr/bin/hysteria|ln_run.*hysteria' openwrt/package/passwall/luci-app-passwall > phase-d-results/passwall-integration.txt
          grep -q '/usr/bin/hysteria' phase-d-results/passwall-integration.txt
          {
            echo "HYSTERIA_SOURCE_COMMIT=$HYSTERIA_SOURCE_COMMIT"
            echo "HYSTERIA_SOURCE_HASH=$HYSTERIA_SOURCE_HASH"
            echo "GO_MODULE=github.com/apernet/hysteria/app/v2"
            echo "GO_REQUIRED=1.25.0"
            echo "GO_TOOLCHAIN=1.25.1"
            git -C openwrt/feeds/packages/lang/golang rev-parse HEAD
          } > phase-d-results/frozen-inputs.txt
      - name: Upload Phase D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-d-hysteria-${{ github.run_id }}
          path: phase-d-results
          if-no-files-found: warn
